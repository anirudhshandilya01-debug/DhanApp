appId: com.anirudh.dhanadvisor
productName: Dhan Advisor
copyright: Copyright © 2025 Anirudh Shandilya

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# Build a Windows NSIS installer (and a portable build is easy to add later).
win:
  target:
    - nsis
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dhan Advisor

# Cross-building a mac/linux artifact is optional; uncomment if needed.
# mac:
#   target: dmg
#   icon: build/icon.png
# linux:
#   target: AppImage
#   icon: build/icon.png
